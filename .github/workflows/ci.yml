name: Stage 1-4 CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  stage1-ci-gate:
    name: Build, Lint, Test, Secret Scan, Skill & Brain Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Package & Dev Dependencies (Build Step)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Linter (Ruff)
        run: |
          ruff check src/ tests/ scripts/

      - name: Secret Scanning Gate (Section 4 & 6)
        run: |
          python - << 'EOF'
          import pathlib, re, sys
          patterns = [
              (r"AIza[0-9A-Za-z\-_]{35}", "Google API Key"),
              (r"GOCSPX-[0-9A-Za-z\-_]{28}", "Google OAuth Client Secret"),
              (r"ya29\.[0-9A-Za-z\-_]+", "Google OAuth Access Token"),
          ]
          excluded = {".git", ".venv", "__pycache__", ".pytest_cache"}
          failures = []
          for path in pathlib.Path(".").rglob("*"):
              if any(part in excluded for part in path.parts) or not path.is_file():
                  continue
              if path.name == "ci.yml":
                  continue
              text = path.read_text(encoding="utf-8", errors="ignore")
              for regex, label in patterns:
                  if re.search(regex, text):
                      failures.append(f"Potential {label} leaked in {path}")
          if failures:
              print("\n".join(failures))
              sys.exit(1)
          print("Secret scan passed: 0 leaked credentials found.")
          EOF

      - name: Validate Agent Skills (SKILL.md Frontmatter & SB-3 Citations)
        run: |
          python scripts/validate_skills.py

      - name: Validate Second Brain Vault (PARA Schema & Broken Wikilinks)
        run: |
          python scripts/validate_brain.py

      - name: Run Automated Test Suite (Fixture Mode - TQ-5)
        env:
          YOUTUBE_PROVIDER_MODE: "fixture"
        run: |
          pytest -v